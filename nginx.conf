server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/wasm;

    # Storybook routes through index.html query strings; serve real files
    # first and fall back to the manager shell.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Only /assets/ is content-hashed, so only there is a long cache safe.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # The shell and the data files must stay fresh so a new snapshot is seen.
    # The sb-manager and sb-addons bundles keep their names across builds, so
    # they revalidate through the default ETag path.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location ~ ^/(index|stories|project)\.json$ {
        add_header Cache-Control "no-cache";
    }

    location /manifests/ {
        add_header Cache-Control "no-cache";
    }

    # Health probe for the orchestrator.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
